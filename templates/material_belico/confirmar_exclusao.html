{% extends "base.html" %}

{% block title %}Confirmar Exclusão — Material Bélico{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center mt-5">
        <div class="col-lg-6">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white fw-bold">
                    <i class="fas fa-exclamation-triangle me-1"></i> Confirmar Exclusão
                </div>
                <div class="card-body text-center">
                    <p class="fs-5">Deseja realmente excluir:</p>
                    <p class="fw-bold fs-4 text-danger">{{ obj }}</p>
                    <p class="text-muted mb-4">{{ titulo }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                                <i class="fas fa-times me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash me-1"></i> Confirmar Exclusão
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
