{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ titulo }} - SIS LOGÍSTICA 2ºBAEP{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-boxes me-2"></i>{{ titulo }}</h1>
        <a href="{% url 'materiais:lista_lotes' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Voltar
        </a>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
            </form>
        </div>
    </div>
</div>
{% endblock %}
