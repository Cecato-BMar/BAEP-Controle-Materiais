{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Nova Devolução de Munição{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="fw-bold mb-0" style="font-size: 1.6rem;">
            <i class="fas fa-undo text-success me-2"></i>Nova Devolução de Munição
        </h1>
        <p class="text-muted mb-0">Registre devolução, disparos e extravios da retirada.</p>
    </div>
    <a href="{% url 'municoes:lista_lotes' %}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="row">
    <div class="col-12">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'municoes:lista_lotes' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">
                            <i class="fas fa-save me-1"></i>Salvar Devolução
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
